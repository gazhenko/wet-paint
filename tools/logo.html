<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3eedc;width:1600px;height:520px;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;overflow:hidden}
.wrap{position:relative;text-align:center}
h1{font-weight:normal;font-size:230px;letter-spacing:.06em;margin:0;line-height:1;color:#2b2b40;position:relative;text-shadow:0 2px 0 #fff}
h1 em{font-style:italic;color:#c43d2f}
.drip{position:absolute;left:-4%;right:-4%;top:-22%;bottom:-18%;z-index:-1;background:
 radial-gradient(ellipse 36% 48% at 18% 55%,rgba(91,127,184,.6),rgba(91,127,184,0) 70%),
 radial-gradient(ellipse 34% 46% at 52% 40%,rgba(224,122,95,.55),rgba(224,122,95,0) 70%),
 radial-gradient(ellipse 30% 44% at 84% 58%,rgba(217,164,65,.55),rgba(217,164,65,0) 70%);filter:blur(2px)}
p{font-style:italic;font-size:44px;color:#5a4a40;margin:22px 0 0;letter-spacing:.02em}
.paper{position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 30% 20%,rgba(120,100,80,.035) 0 2px,transparent 2px 7px),repeating-radial-gradient(circle at 70% 80%,rgba(120,100,80,.03) 0 1px,transparent 1px 5px)}
</style></head><body><div class="paper"></div><div class="wrap"><h1><span class="drip"></span>Wet <em>Paint</em></h1><p>a watercolour flight over Koriko</p></div></body></html>
